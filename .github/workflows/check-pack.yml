# Checks every pack in this repository on each push and pull request: the content checks Install-MtPack runs
# (Test-MtPack, which must rate the pack Low with no findings), every test once through the engine, and the Pester
# tests of the helpers. After a push to main passes, a release job publishes each pack whose manifest version has no
# release yet. Tags are <pack folder>-v<Version>, such as intune-anomalies-v0.1.0. Install-MtPack picks the newest
# release of the repository once it is older than the cooldown, and reads the pack folder from it.
# The release job runs only when the repository variable PACK_RELEASES is true.
name: Check packs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Maester and Pester
        shell: pwsh
        run: |
          # Maester 3.0 is in preview until it is released; Install-PSResource -Prerelease gets the newest preview.
          Install-PSResource -Name Maester -Prerelease -TrustRepository -Quiet
          Install-PSResource -Name Pester -TrustRepository -Quiet

      - name: Check each pack
        shell: pwsh
        run: |
          Import-Module Maester
          $packs = @(Get-ChildItem -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'maester-pack.json') })
          if ($packs.Count -eq 0) { throw 'No pack folders found.' }
          foreach ($pack in $packs) {
            $check = Test-MtPack $pack.FullName
            $check | Format-List Id, Version, IsValid, Risk, Errors, Warnings, Findings
            if (-not $check.IsValid) { throw "$($pack.Name): the pack is not valid." }
            if ($check.Risk -ne 'Low') { throw "$($pack.Name): the content checks rate the pack $($check.Risk); it must stay Low." }
            if (@($check.Findings).Count) { throw "$($pack.Name): $(@($check.Findings).Count) finding(s)." }
            $results = @(Invoke-MtTest -Path $pack.FullName)
            $results | Format-Table Id, Result, ReasonCode -AutoSize | Out-String -Width 200
            $broken = @($results | Where-Object { $_.ReasonCode -in 'InvalidMetadata', 'InvalidReturn', 'InvalidConfiguration', 'InvalidInstanceId', 'InstanceSourceFailed', 'DuplicateId' -or $_.Result -eq 'Error' })
            if ($broken) { throw "$($pack.Name): the engine could not run or errored on $($broken.Id -join ', ')" }
          }

      - name: Pester tests of the helpers
        shell: pwsh
        run: |
          $r = Invoke-Pester ./tests -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PACK_RELEASES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
    steps:
      - uses: actions/checkout@v5

      - name: Publish new pack versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($pack in @(Get-ChildItem -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'maester-pack.json') })) {
            $version = [string](Get-Content -LiteralPath (Join-Path $pack.FullName 'maester-pack.json') -Raw | ConvertFrom-Json).Version
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "$($pack.Name): Version '$version' is not major.minor.patch." }
            $tag = "$($pack.Name)-v$version"
            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Output "$tag exists."; $global:LASTEXITCODE = 0; continue }
            $global:LASTEXITCODE = 0
            $log = Get-Content -LiteralPath CHANGELOG.md -Raw
            $section = [regex]::Match($log, '(?ms)^## ' + [regex]::Escape("$($pack.Name) $version") + '[ \t]*\r?\n(.*?)(?=^## |\z)')
            $notes = if ($section.Success -and $section.Groups[1].Value.Trim()) { $section.Groups[1].Value.Trim() } else { "$($pack.Name) $version." }
            $notesFile = Join-Path $env:RUNNER_TEMP "$tag.md"
            [System.IO.File]::WriteAllText($notesFile, $notes + "`n")
            gh release create $tag --target (git rev-parse HEAD) --title $tag --notes-file $notesFile --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not publish $tag." }
            "Published **$tag**." >> $env:GITHUB_STEP_SUMMARY
          }
